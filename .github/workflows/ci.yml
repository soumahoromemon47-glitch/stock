name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier Node SQLite
        run: node --input-type=module -e "import { DatabaseSync } from 'node:sqlite'; console.log('SQLite OK:', typeof DatabaseSync)"

      - name: Exécuter les tests
        run: npm test
