name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
          cache: npm

      - name: Verify Node version
        run: node -v

      - name: Verify SQLite
        run: node --input-type=module -e "import { DatabaseSync } from 'node:sqlite'; console.log('SQLite OK:', typeof DatabaseSync)"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
